<div class="bofForm" ID="$bof ? ID$">

  <form>

    $bof foreach inputs$
    <div class="input_wrapper type_$bof ? input^type$ name_$bof ? input^name$">
      <div class="label">$bof ? label$</div>
      <div class="_input">$bof html input __name=o_input$</div>
      $bof if tip$<div class="tip">$bof ? ?$</div>$!bof if tip$
    </div>
    $!bof foreach inputs$

  </form>

  <div class="buttons">
    <div class="_error" role="alert"></div>
    <span class="st_status" role="status" aria-live="polite"></span>
    <button type="button" class="btn btn-primary _submit">$bof ? Lang^submit __uc=true$</button>
  </div>

</div>
